name: Daily News Aggregator Bot

on:
  schedule:
    # Runs daily at 00:15 UTC (07:15 AM UTC+7 / Vietnam Time)
    # Using an off-peak minute (15) prevents GitHub Actions scheduler delay/drop at 00:00 exact hour
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run News Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: java -jar target/java-news-bot-1.0.0.jar
